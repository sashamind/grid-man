<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grid Man — сетка и человечек</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: none; }
  #stage { display: block; width: 100vw; height: 100vh; }

  .hint {
    position: fixed;
    left: 14px; bottom: 12px;
    font: 12px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #888;
    pointer-events: none;
    user-select: none;
    max-width: 340px;
    text-shadow: 0 1px 2px #000;
  }
  .hint b { color: #e5231a; font-weight: 600; }

  #reset {
    position: fixed;
    right: 14px; top: 12px;
    font: 12px -apple-system, Segoe UI, Roboto, sans-serif;
    color: #bbb;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #reset:hover { color: #fff; border-color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <button id="reset">Сброс</button>
  <div class="hint">
    Перетаскивай <b>линии сетки</b>. Тяни <b>ладони и ступни</b> (полукруги) —
    они прилипают к 4 линиям ячейки человечка и перекидываются на соседнюю линию,
    если она ближе. <b>Голова</b> двигается свободно. Скелет подстраивается сам.
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  // ---- Grid: line positions as fractions [0..1] so it stays responsive.
  //      First/last are the outer border (fixed); interior lines are draggable.
  const DEFAULT_V = [0.0, 0.28, 0.39, 0.82, 1.0];
  const DEFAULT_H = [0.0, 0.26, 0.43, 0.81, 1.0];
  let vfrac = DEFAULT_V.slice();
  let hfrac = DEFAULT_H.slice();

  // ---- The figure lives inside ONE cell. All 4 limbs (hands + feet) may only
  //      cling to the 4 boundary lines of THAT cell. (column ci, row rj)
  const CELL = { ci: 2, rj: 2 };

  // ---- Limbs: each is magnetised to one of the cell's 4 lines (side) at
  //      parameter t (0..1) along it. Drawn as a semicircle gripping the line.
  const DEFAULT_LIMBS = () => [
    { kind: "hand", side: "left",   t: 0.42 },  // left hand
    { kind: "hand", side: "top",    t: 0.86 },  // right hand
    { kind: "foot", side: "bottom", t: 0.28 },  // left foot
    { kind: "foot", side: "bottom", t: 0.74 },  // right foot
  ];
  let limbs = DEFAULT_LIMBS();

  // ---- Head: a free circle (NOT clinging to the lines), but always kept INSIDE
  //      the figure's cell. Stored as (u,v) in [0..1] relative to that cell.
  const DEFAULT_HEAD = () => ({ u: 0.5, v: 0.28 });
  let head = DEFAULT_HEAD();

  const HEAD_R = 26;
  const LIMB_R = 21;
  const JOINT_R = 5;     // elbow / knee marker
  const LINE_W = 3.2;
  // Bone lengths as a fraction of the viewport's smaller side, so limbs bend at
  // rest and straighten as the points are pulled apart.
  const ARM_BONE = 0.15; // upper arm == forearm
  const LEG_BONE = 0.16; // thigh == shin
  const RED = "#e5231a";
  const GRID = "rgba(255,255,255,0.85)";
  const HIT_LINE = 12;   // px tolerance for grabbing a grid line
  const HIT_PAD = 14;    // extra px around a point for grabbing it

  // ---------- geometry helpers ----------
  const vx = i => vfrac[i] * W;
  const hy = j => hfrac[j] * H;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  function cellBounds() {
    return { x0: vx(CELL.ci), x1: vx(CELL.ci + 1), y0: hy(CELL.rj), y1: hy(CELL.rj + 1) };
  }

  // Keep the head circle fully inside the cell (fall back to centre if the cell
  // is smaller than the head).
  function headPos() {
    const b = cellBounds();
    const x = b.x0 + head.u * (b.x1 - b.x0);
    const y = b.y0 + head.v * (b.y1 - b.y0);
    const minX = b.x0 + HEAD_R, maxX = b.x1 - HEAD_R;
    const minY = b.y0 + HEAD_R, maxY = b.y1 - HEAD_R;
    return {
      x: minX <= maxX ? clamp(x, minX, maxX) : (b.x0 + b.x1) / 2,
      y: minY <= maxY ? clamp(y, minY, maxY) : (b.y0 + b.y1) / 2,
    };
  }

  function limbPos(l) {
    const b = cellBounds();
    switch (l.side) {
      case "left":   return { x: b.x0, y: b.y0 + l.t * (b.y1 - b.y0) };
      case "right":  return { x: b.x1, y: b.y0 + l.t * (b.y1 - b.y0) };
      case "top":    return { x: b.x0 + l.t * (b.x1 - b.x0), y: b.y0 };
      case "bottom": return { x: b.x0 + l.t * (b.x1 - b.x0), y: b.y1 };
    }
  }

  // Inward direction (into the cell) the semicircle's dome should face.
  function inward(side) {
    return side === "left"  ? { x: 1, y: 0 }
         : side === "right" ? { x: -1, y: 0 }
         : side === "top"   ? { x: 0, y: 1 }
         :                    { x: 0, y: -1 };
  }

  // Re-snap a limb to the nearest boundary line of the cell, clamped inside it.
  function snapLimb(l, mx, my) {
    const b = cellBounds();
    const px = clamp(mx, b.x0, b.x1);
    const py = clamp(my, b.y0, b.y1);
    const dLeft = px - b.x0, dRight = b.x1 - px;
    const dTop = py - b.y0, dBottom = b.y1 - py;
    const m = Math.min(dLeft, dRight, dTop, dBottom);
    const w = (b.x1 - b.x0) || 1, h = (b.y1 - b.y0) || 1;
    if (m === dLeft)       { l.side = "left";   l.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dRight) { l.side = "right";  l.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dTop)   { l.side = "top";    l.t = clamp((px - b.x0) / w, 0, 1); }
    else                   { l.side = "bottom"; l.t = clamp((px - b.x0) / w, 0, 1); }
  }

  // Two-bone IK: given root R and target T with bone lengths l1,l2, return the
  // joint (elbow/knee). The joint bulges to whichever side is farther from the
  // body centre C (natural outward bend). If T is out of reach, the limb goes
  // straight (joint on the R→T line).
  function ik2(R, T, l1, l2, C) {
    const dx = T.x - R.x, dy = T.y - R.y;
    const d = Math.hypot(dx, dy);
    if (d < 1e-6) return { x: R.x, y: R.y };
    const bx = dx / d, by = dy / d;
    if (d >= l1 + l2) return { x: R.x + bx * l1, y: R.y + by * l1 };
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const mx = R.x + bx * a, my = R.y + by * a;
    const px = -by, py = bx;
    const e1 = { x: mx + px * h, y: my + py * h };
    const e2 = { x: mx - px * h, y: my - py * h };
    const d1 = (e1.x - C.x) ** 2 + (e1.y - C.y) ** 2;
    const d2 = (e2.x - C.x) ** 2 + (e2.y - C.y) ** 2;
    return d1 >= d2 ? e1 : e2;
  }

  // ---------- skeleton ----------
  function skeleton() {
    const hd = headPos();
    const lh = limbPos(limbs[0]);
    const rh = limbPos(limbs[1]);
    const lf = limbPos(limbs[2]);
    const rf = limbPos(limbs[3]);
    const feetC = { x: (lf.x + rf.x) / 2, y: (lf.y + rf.y) / 2 };
    const shoulder = lerp(hd, feetC, 0.30);
    const pelvis = lerp(hd, feetC, 0.62);
    const core = lerp(shoulder, pelvis, 0.5);
    const minDim = Math.min(W, H);
    const arm = ARM_BONE * minDim;
    const leg = LEG_BONE * minDim;
    const elbowL = ik2(shoulder, lh, arm, arm, core);
    const elbowR = ik2(shoulder, rh, arm, arm, core);
    const kneeL = ik2(pelvis, lf, leg, leg, core);
    const kneeR = ik2(pelvis, rf, leg, leg, core);
    return { head: hd, lh, rh, lf, rf, shoulder, pelvis, elbowL, elbowR, kneeL, kneeR };
  }

  // ---------- rendering ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < vfrac.length; i++) {
      const x = Math.round(vx(i)) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let j = 0; j < hfrac.length; j++) {
      const y = Math.round(hy(j)) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // faint highlight of the figure's cell (the 4 lines its limbs cling to)
    const b = cellBounds();
    ctx.fillStyle = "rgba(229,35,26,0.05)";
    ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);

    // skeleton bones
    const s = skeleton();
    ctx.strokeStyle = RED;
    ctx.lineWidth = LINE_W;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    // spine
    ctx.moveTo(s.head.x, s.head.y); ctx.lineTo(s.shoulder.x, s.shoulder.y);
    ctx.lineTo(s.pelvis.x, s.pelvis.y);
    // arms: shoulder -> elbow -> hand
    ctx.moveTo(s.shoulder.x, s.shoulder.y); ctx.lineTo(s.elbowL.x, s.elbowL.y); ctx.lineTo(s.lh.x, s.lh.y);
    ctx.moveTo(s.shoulder.x, s.shoulder.y); ctx.lineTo(s.elbowR.x, s.elbowR.y); ctx.lineTo(s.rh.x, s.rh.y);
    // legs: pelvis -> knee -> foot
    ctx.moveTo(s.pelvis.x, s.pelvis.y); ctx.lineTo(s.kneeL.x, s.kneeL.y); ctx.lineTo(s.lf.x, s.lf.y);
    ctx.moveTo(s.pelvis.x, s.pelvis.y); ctx.lineTo(s.kneeR.x, s.kneeR.y); ctx.lineTo(s.rf.x, s.rf.y);
    ctx.stroke();

    // elbow / knee joints
    ctx.fillStyle = RED;
    for (const j of [s.elbowL, s.elbowR, s.kneeL, s.kneeR]) {
      ctx.beginPath(); ctx.arc(j.x, j.y, JOINT_R, 0, Math.PI * 2); ctx.fill();
    }

    // hands & feet as semicircles gripping their line
    ctx.fillStyle = RED;
    for (let i = 0; i < limbs.length; i++) semicircle(limbs[i]);

    // head as a full circle (free)
    ctx.beginPath();
    ctx.arc(s.head.x, s.head.y, HEAD_R, 0, Math.PI * 2);
    ctx.fill();

    if (hover) drawHover(hover);
  }

  function semicircle(l) {
    const p = limbPos(l);
    const d = inward(l.side);
    const phi = Math.atan2(d.y, d.x);
    ctx.beginPath();
    ctx.arc(p.x, p.y, LIMB_R, phi - Math.PI / 2, phi + Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }

  function drawHover(hv) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    if (hv.type === "head") {
      const p = headPos();
      ctx.beginPath(); ctx.arc(p.x, p.y, HEAD_R + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (hv.type === "limb") {
      const p = limbPos(limbs[hv.index]);
      ctx.beginPath(); ctx.arc(p.x, p.y, LIMB_R + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (hv.type === "vline") {
      const x = vx(hv.index);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    } else if (hv.type === "hline") {
      const y = hy(hv.index);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- hit testing ----------
  function pick(mx, my) {
    // head first
    const hp = headPos();
    if ((mx - hp.x) ** 2 + (my - hp.y) ** 2 <= (HEAD_R + HIT_PAD) ** 2) {
      return { type: "head" };
    }
    // limbs
    for (let i = 0; i < limbs.length; i++) {
      const p = limbPos(limbs[i]);
      if ((mx - p.x) ** 2 + (my - p.y) ** 2 <= (LIMB_R + HIT_PAD) ** 2) {
        return { type: "limb", index: i };
      }
    }
    // interior grid lines
    let best = null, bestD = HIT_LINE;
    for (let i = 1; i < vfrac.length - 1; i++) {
      const d = Math.abs(mx - vx(i));
      if (d < bestD) { bestD = d; best = { type: "vline", index: i }; }
    }
    for (let j = 1; j < hfrac.length - 1; j++) {
      const d = Math.abs(my - hy(j));
      if (d < bestD) { bestD = d; best = { type: "hline", index: j }; }
    }
    return best;
  }

  // ---------- interaction ----------
  let drag = null;
  let hover = null;

  function pointerXY(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function applyDrag(x, y) {
    if (drag.type === "head") {
      const b = cellBounds();
      head.u = clamp((x - b.x0) / ((b.x1 - b.x0) || 1), 0, 1);
      head.v = clamp((y - b.y0) / ((b.y1 - b.y0) || 1), 0, 1);
    } else if (drag.type === "limb") {
      snapLimb(limbs[drag.index], x, y);
    } else if (drag.type === "vline") {
      const i = drag.index;
      vfrac[i] = clamp(x / W, vfrac[i - 1] + 0.03, vfrac[i + 1] - 0.03);
    } else if (drag.type === "hline") {
      const j = drag.index;
      hfrac[j] = clamp(y / H, hfrac[j - 1] + 0.03, hfrac[j + 1] - 0.03);
    }
  }

  function onDown(e) {
    const { x, y } = pointerXY(e);
    const hit = pick(x, y);
    if (!hit) return;
    drag = hit;
    applyDrag(x, y);
    canvas.setPointerCapture(e.pointerId);
    hover = drag;
    draw();
  }

  function onMove(e) {
    const { x, y } = pointerXY(e);
    if (!drag) { hover = pick(x, y); updateCursor(); draw(); return; }
    applyDrag(x, y);
    hover = drag;
    draw();
  }

  function onUp(e) {
    drag = null;
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    const { x, y } = pointerXY(e);
    hover = pick(x, y);
    updateCursor();
    draw();
  }

  function updateCursor() {
    canvas.style.cursor = !hover ? "default"
      : (hover.type === "head" || hover.type === "limb") ? "grab"
      : hover.type === "vline" ? "ew-resize" : "ns-resize";
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("pointerleave", () => { if (!drag) { hover = null; updateCursor(); draw(); } });

  document.getElementById("reset").addEventListener("click", () => {
    vfrac = DEFAULT_V.slice();
    hfrac = DEFAULT_H.slice();
    limbs = DEFAULT_LIMBS();
    head = DEFAULT_HEAD();
    draw();
  });

  // ---------- resize ----------
  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    draw();
  }
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
