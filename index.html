<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grid Man — сетка и человечек</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e9e6d3; }
  body { touch-action: none; }
  #stage { display: block; width: 100vw; height: 100vh; }

  .hint {
    position: fixed;
    left: 14px; bottom: 12px;
    font: 12px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #6b6959;
    pointer-events: none;
    user-select: none;
    max-width: 340px;
  }
  .hint b { color: #16150f; font-weight: 600; }

  #reset {
    position: fixed;
    right: 14px; top: 12px;
    font: 12px -apple-system, Segoe UI, Roboto, sans-serif;
    color: #45433a;
    background: rgba(0,0,0,.04);
    border: 1px solid rgba(0,0,0,.18);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #reset:hover { color: #000; border-color: rgba(0,0,0,.45); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <button id="reset">Сброс</button>
  <div class="hint">
    Перетаскивай <b>линии сетки</b>. Тяни <b>ладони и ступни</b> — они прилипают
    к 4 линиям ячейки человечка и перекидываются на соседнюю линию, если она ближе.
    <b>Голова</b> двигается внутри ячейки. Локти и колени сгибаются сами.
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  // ---- Grid: line positions as fractions [0..1] so it stays responsive.
  //      First/last are the outer border (fixed); interior lines are draggable.
  const DEFAULT_V = [0.0, 0.25, 0.5, 0.75, 1.0];
  const DEFAULT_H = [0.0, 0.25, 0.5, 0.75, 1.0];
  let vfrac = DEFAULT_V.slice();
  let hfrac = DEFAULT_H.slice();

  // ---- The figure lives inside ONE cell. All 4 limbs (hands + feet) may only
  //      cling to the 4 boundary lines of THAT cell. (column ci, row rj)
  const CELL = { ci: 2, rj: 2 };

  // ---- Limbs: each is magnetised to one of the cell's 4 lines (side) at
  //      parameter t (0..1) along it. Drawn as a rounded hand/foot end.
  const DEFAULT_LIMBS = () => [
    { kind: "hand", side: "left",   t: 0.42 },  // left hand
    { kind: "hand", side: "top",    t: 0.86 },  // right hand
    { kind: "foot", side: "bottom", t: 0.28 },  // left foot
    { kind: "foot", side: "bottom", t: 0.74 },  // right foot
  ];
  let limbs = DEFAULT_LIMBS();

  // ---- Head: a free circle (NOT clinging to the lines), but always kept INSIDE
  //      the figure's cell. Stored as (u,v) in [0..1] relative to that cell.
  const DEFAULT_HEAD = () => ({ u: 0.5, v: 0.22 });
  let head = DEFAULT_HEAD();

  // Pictogram look: sizes are fractions of the base cell so they scale.
  const HEAD_FRAC = 0.065;  // head radius
  const THICK_FRAC = 0.15;  // limb thickness (full width at the root)
  const BODY_MUL = 2.0;     // torso is this much thicker than a limb
  const END_MUL = 1.3;      // limbs widen to this ×root width at hands/feet
  const FIG = "#16150f";    // figure colour
  const GRID = "rgba(20,18,10,0.16)";
  // Bone lengths are CONSTANT (a fraction of the base cell = 0.25 of the smaller
  // viewport side), not tied to the current cell. So a limb's real length never
  // changes when you drag the grid — it only *looks* longer as it straightens
  // out, and can only extend past the bones' sum when fully straight.
  const REF_CELL_FRAC = 0.25; // base (equal) cell size as a fraction of viewport
  const ARM_BONE = 0.28;      // upper arm == forearm, fraction of the base cell
  const LEG_BONE = 0.24;      // thigh == shin
  const HIT_LINE = 12;   // px tolerance for grabbing a grid line
  const HIT_PAD = 18;    // extra px around a point for grabbing it

  // ---------- geometry helpers ----------
  const vx = i => vfrac[i] * W;
  const hy = j => hfrac[j] * H;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  // Scale reference: the constant base cell size (0.25 of the smaller viewport side).
  const refCell = () => REF_CELL_FRAC * Math.min(W, H);
  const headR = () => HEAD_FRAC * refCell();
  const thick = () => THICK_FRAC * refCell();

  function cellBounds() {
    return { x0: vx(CELL.ci), x1: vx(CELL.ci + 1), y0: hy(CELL.rj), y1: hy(CELL.rj + 1) };
  }

  // Keep the head circle fully inside the cell (fall back to centre if the cell
  // is smaller than the head).
  function headPos() {
    const b = cellBounds();
    const x = b.x0 + head.u * (b.x1 - b.x0);
    const y = b.y0 + head.v * (b.y1 - b.y0);
    const r = headR();
    const minX = b.x0 + r, maxX = b.x1 - r;
    const minY = b.y0 + r, maxY = b.y1 - r;
    return {
      x: minX <= maxX ? clamp(x, minX, maxX) : (b.x0 + b.x1) / 2,
      y: minY <= maxY ? clamp(y, minY, maxY) : (b.y0 + b.y1) / 2,
    };
  }

  function limbPos(l) {
    const b = cellBounds();
    switch (l.side) {
      case "left":   return { x: b.x0, y: b.y0 + l.t * (b.y1 - b.y0) };
      case "right":  return { x: b.x1, y: b.y0 + l.t * (b.y1 - b.y0) };
      case "top":    return { x: b.x0 + l.t * (b.x1 - b.x0), y: b.y0 };
      case "bottom": return { x: b.x0 + l.t * (b.x1 - b.x0), y: b.y1 };
    }
  }

  // Direction pointing into the cell from a limb's boundary line.
  function inward(side) {
    return side === "left"  ? { x: 1, y: 0 }
         : side === "right" ? { x: -1, y: 0 }
         : side === "top"   ? { x: 0, y: 1 }
         :                    { x: 0, y: -1 };
  }

  // The drawn hand/foot centre: pushed inward by its radius r and clamped so the
  // rounded end stays fully inside the cell.
  function limbEnd(l, r) {
    const b = cellBounds();
    const p = limbPos(l), d = inward(l.side);
    return {
      x: clamp(p.x + d.x * r, b.x0 + r, b.x1 - r),
      y: clamp(p.y + d.y * r, b.y0 + r, b.y1 - r),
    };
  }

  // Re-snap a limb to the nearest boundary line of the cell, clamped inside it.
  function snapLimb(l, mx, my) {
    const b = cellBounds();
    const px = clamp(mx, b.x0, b.x1);
    const py = clamp(my, b.y0, b.y1);
    const dLeft = px - b.x0, dRight = b.x1 - px;
    const dTop = py - b.y0, dBottom = b.y1 - py;
    const m = Math.min(dLeft, dRight, dTop, dBottom);
    const w = (b.x1 - b.x0) || 1, h = (b.y1 - b.y0) || 1;
    if (m === dLeft)       { l.side = "left";   l.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dRight) { l.side = "right";  l.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dTop)   { l.side = "top";    l.t = clamp((px - b.x0) / w, 0, 1); }
    else                   { l.side = "bottom"; l.t = clamp((px - b.x0) / w, 0, 1); }
  }

  // How far a point pokes outside the cell (0 if inside).
  function outside(p, b) {
    return Math.max(0, b.x0 - p.x) + Math.max(0, p.x - b.x1)
         + Math.max(0, b.y0 - p.y) + Math.max(0, p.y - b.y1);
  }

  const DOWN_BIAS = 0.35; // knees/elbows sag downward when the limb is horizontal

  // Two-bone IK: given root R and target T with bone lengths l1,l2, return the
  // joint (elbow/knee). It bends OUTWARD (away from the body's vertical axis at
  // axisX) and slightly downward — natural for both elbows and knees — but flips
  // to the other side if that would poke out of cell b. Always clamped inside the
  // cell. If T is out of reach, the limb goes straight.
  function ik2(R, T, l1, l2, b, axisX) {
    const dx = T.x - R.x, dy = T.y - R.y;
    const d = Math.hypot(dx, dy);
    let joint;
    if (d < 1e-6) {
      joint = { x: R.x, y: R.y };
    } else if (d >= l1 + l2) {
      // out of reach: straight limb, joint at its proportional spot on the line
      const f = l1 / (l1 + l2);
      joint = { x: R.x + dx * f, y: R.y + dy * f };
    } else {
      const bx = dx / d, by = dy / d;
      const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
      const mx = R.x + bx * a, my = R.y + by * a;
      const px = -by, py = bx;              // perpendicular to the limb
      // preferred (natural) bend: outward + a little down
      const outward = Math.sign(T.x - R.x) || Math.sign(T.x - axisX) || 1;
      const s = (px * outward + py * DOWN_BIAS) >= 0 ? 1 : -1;
      const ePref = { x: mx + px * h * s, y: my + py * h * s };
      const eAlt  = { x: mx - px * h * s, y: my - py * h * s };
      // keep the natural side unless it leaves the cell more than the other
      joint = outside(ePref, b) <= outside(eAlt, b) ? ePref : eAlt;
    }
    // safety clamp so a joint never leaves the cell
    joint.x = clamp(joint.x, b.x0, b.x1);
    joint.y = clamp(joint.y, b.y0, b.y1);
    return joint;
  }

  // ---------- skeleton ----------
  function skeleton() {
    const hd = headPos();
    const endR = 0.5 * THICK_FRAC * refCell() * END_MUL; // hand/foot half-width
    // hands/feet are inset so their rounded caps stay inside the cell
    const lh = limbEnd(limbs[0], endR);
    const rh = limbEnd(limbs[1], endR);
    const lf = limbEnd(limbs[2], endR);
    const rf = limbEnd(limbs[3], endR);
    const feetC = { x: (lf.x + rf.x) / 2, y: (lf.y + rf.y) / 2 };
    const shoulder = lerp(hd, feetC, 0.34);
    const pelvis = lerp(hd, feetC, 0.64);
    const axisX = lerp(shoulder, pelvis, 0.5).x; // body's vertical axis
    const b = cellBounds();
    const rc = refCell(); // constant base cell size
    const arm = ARM_BONE * rc;
    const leg = LEG_BONE * rc;
    const elbowL = ik2(shoulder, lh, arm, arm, b, axisX);
    const elbowR = ik2(shoulder, rh, arm, arm, b, axisX);
    const kneeL = ik2(pelvis, lf, leg, leg, b, axisX);
    const kneeR = ik2(pelvis, rf, leg, leg, b, axisX);
    return { head: hd, lh, rh, lf, rf, shoulder, pelvis, elbowL, elbowR, kneeL, kneeR };
  }

  // ---------- rendering ----------
  // Filled quad between two circles (radii rP, rQ) — a tapered segment.
  function taperSegment(P, Q, rP, rQ) {
    const dx = Q.x - P.x, dy = Q.y - P.y;
    const L = Math.hypot(dx, dy);
    if (L < 1e-6) return;
    const nx = -dy / L, ny = dx / L;
    ctx.beginPath();
    ctx.moveTo(P.x + nx * rP, P.y + ny * rP);
    ctx.lineTo(Q.x + nx * rQ, Q.y + ny * rQ);
    ctx.lineTo(Q.x - nx * rQ, Q.y - ny * rQ);
    ctx.lineTo(P.x - nx * rP, P.y - ny * rP);
    ctx.closePath();
    ctx.fill();
  }

  // A two-bone limb root R -> joint J -> end E, half-width lerping rootR..endR,
  // with rounded joint and end. Overlapping fills merge into one smooth shape.
  function taperedLimb(R, J, E, rootR, endR) {
    const l1 = Math.hypot(J.x - R.x, J.y - R.y);
    const l2 = Math.hypot(E.x - J.x, E.y - J.y);
    const total = l1 + l2 || 1;
    const jointR = rootR + (endR - rootR) * (l1 / total);
    taperSegment(R, J, rootR, jointR);
    taperSegment(J, E, jointR, endR);
    disc(R, rootR); disc(J, jointR); disc(E, endR);
  }

  function disc(p, r) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#e9e6d3";
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < vfrac.length; i++) {
      const x = Math.round(vx(i)) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let j = 0; j < hfrac.length; j++) {
      const y = Math.round(hy(j)) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // faint highlight of the figure's cell
    const b = cellBounds();
    ctx.fillStyle = "rgba(20,18,10,0.04)";
    ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);

    // figure
    const s = skeleton();
    const t = thick();
    const rootR = 0.5 * t;             // limb half-width at the root
    const endR = rootR * END_MUL;      // ...widening toward the hand/foot
    ctx.fillStyle = FIG;

    // arms & legs: tapered, thickening toward the ends
    taperedLimb(s.shoulder, s.elbowL, s.lh, rootR, endR);
    taperedLimb(s.shoulder, s.elbowR, s.rh, rootR, endR);
    taperedLimb(s.pelvis, s.kneeL, s.lf, rootR, endR);
    taperedLimb(s.pelvis, s.kneeR, s.rf, rootR, endR);

    // torso: thicker round-capped bar
    ctx.strokeStyle = FIG;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = t * BODY_MUL;
    ctx.beginPath();
    ctx.moveTo(s.shoulder.x, s.shoulder.y); ctx.lineTo(s.pelvis.x, s.pelvis.y);
    ctx.stroke();

    // head: detached filled circle
    ctx.beginPath();
    ctx.arc(s.head.x, s.head.y, headR(), 0, Math.PI * 2);
    ctx.fill();

    if (hover) drawHover(hover);
  }

  function drawHover(hv) {
    ctx.save();
    ctx.strokeStyle = "rgba(20,18,10,0.4)";
    ctx.lineWidth = 2;
    if (hv.type === "head") {
      const p = headPos();
      ctx.beginPath(); ctx.arc(p.x, p.y, headR() + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (hv.type === "limb") {
      const p = limbPos(limbs[hv.index]);
      ctx.beginPath(); ctx.arc(p.x, p.y, thick() * 0.6 + 6, 0, Math.PI * 2); ctx.stroke();
    } else if (hv.type === "vline") {
      const x = vx(hv.index);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    } else if (hv.type === "hline") {
      const y = hy(hv.index);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- hit testing ----------
  function pick(mx, my) {
    // head first
    const hp = headPos();
    if ((mx - hp.x) ** 2 + (my - hp.y) ** 2 <= (headR() + HIT_PAD) ** 2) {
      return { type: "head" };
    }
    // limbs (grab near the rounded hand/foot end)
    const grab = thick() * 0.6 + HIT_PAD;
    for (let i = 0; i < limbs.length; i++) {
      const p = limbPos(limbs[i]);
      if ((mx - p.x) ** 2 + (my - p.y) ** 2 <= grab * grab) {
        return { type: "limb", index: i };
      }
    }
    // interior grid lines
    let best = null, bestD = HIT_LINE;
    for (let i = 1; i < vfrac.length - 1; i++) {
      const d = Math.abs(mx - vx(i));
      if (d < bestD) { bestD = d; best = { type: "vline", index: i }; }
    }
    for (let j = 1; j < hfrac.length - 1; j++) {
      const d = Math.abs(my - hy(j));
      if (d < bestD) { bestD = d; best = { type: "hline", index: j }; }
    }
    return best;
  }

  // ---------- interaction ----------
  let drag = null;
  let hover = null;

  function pointerXY(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function applyDrag(x, y) {
    if (drag.type === "head") {
      const b = cellBounds();
      head.u = clamp((x - b.x0) / ((b.x1 - b.x0) || 1), 0, 1);
      head.v = clamp((y - b.y0) / ((b.y1 - b.y0) || 1), 0, 1);
    } else if (drag.type === "limb") {
      snapLimb(limbs[drag.index], x, y);
    } else if (drag.type === "vline") {
      const i = drag.index;
      vfrac[i] = clamp(x / W, vfrac[i - 1] + 0.03, vfrac[i + 1] - 0.03);
    } else if (drag.type === "hline") {
      const j = drag.index;
      hfrac[j] = clamp(y / H, hfrac[j - 1] + 0.03, hfrac[j + 1] - 0.03);
    }
  }

  function onDown(e) {
    const { x, y } = pointerXY(e);
    const hit = pick(x, y);
    if (!hit) return;
    drag = hit;
    applyDrag(x, y);
    canvas.setPointerCapture(e.pointerId);
    hover = drag;
    draw();
  }

  function onMove(e) {
    const { x, y } = pointerXY(e);
    if (!drag) { hover = pick(x, y); updateCursor(); draw(); return; }
    applyDrag(x, y);
    hover = drag;
    draw();
  }

  function onUp(e) {
    drag = null;
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    const { x, y } = pointerXY(e);
    hover = pick(x, y);
    updateCursor();
    draw();
  }

  function updateCursor() {
    canvas.style.cursor = !hover ? "default"
      : (hover.type === "head" || hover.type === "limb") ? "grab"
      : hover.type === "vline" ? "ew-resize" : "ns-resize";
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("pointerleave", () => { if (!drag) { hover = null; updateCursor(); draw(); } });

  document.getElementById("reset").addEventListener("click", () => {
    vfrac = DEFAULT_V.slice();
    hfrac = DEFAULT_H.slice();
    limbs = DEFAULT_LIMBS();
    head = DEFAULT_HEAD();
    draw();
  });

  // ---------- resize ----------
  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    draw();
  }
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
