<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grid Man — сетка и человечек</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: none; }
  #stage { display: block; width: 100vw; height: 100vh; }

  .hint {
    position: fixed;
    left: 14px; bottom: 12px;
    font: 12px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #888;
    pointer-events: none;
    user-select: none;
    max-width: 320px;
    text-shadow: 0 1px 2px #000;
  }
  .hint b { color: #e02318; font-weight: 600; }

  #reset {
    position: fixed;
    right: 14px; top: 12px;
    font: 12px -apple-system, Segoe UI, Roboto, sans-serif;
    color: #bbb;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #reset:hover { color: #fff; border-color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <button id="reset">Сброс</button>
  <div class="hint">
    Перетаскивай <b>линии сетки</b> — они гнут пространство.<br>
    Тяни <b>точки</b> (ладони и ступни) — они скользят вдоль ближайшей
    линии внутри своей ячейки и перекидываются на перпендикулярную.
    Скелет человечка подстраивается сам.
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  // ---- Grid: line positions stored as fractions [0..1] so it stays responsive.
  //      First/last are the outer border (fixed); interior lines are draggable.
  const DEFAULT_V = [0.0, 0.28, 0.39, 0.82, 1.0];
  const DEFAULT_H = [0.0, 0.26, 0.43, 0.81, 1.0];
  let vfrac = DEFAULT_V.slice();
  let hfrac = DEFAULT_H.slice();

  // ---- Anchors: the 5 red points (head, two hands, two feet).
  //      Each lives in ONE cell (ci = column, rj = row) and is magnetised to one
  //      of the cell's 4 boundary lines (side), at parameter t (0..1) along it.
  //      It never leaves its cell.
  function makeAnchor(kind, ci, rj, side, t) {
    return { kind, ci, rj, side, t };
  }
  const DEFAULT_ANCHORS = () => [
    makeAnchor("head",  2, 2, "top",    0.55),
    makeAnchor("hand",  1, 2, "right",  0.35),  // left hand
    makeAnchor("hand",  3, 1, "left",   0.85),  // right hand
    makeAnchor("foot",  1, 3, "top",    0.55),  // left foot
    makeAnchor("foot",  3, 3, "top",    0.30),  // right foot
  ];
  let anchors = DEFAULT_ANCHORS();

  const HEAD_R = 26;
  const LIMB_R = 17;
  const LINE_W = 3.2;
  const RED = "#e5231a";
  const GRID = "rgba(255,255,255,0.85)";
  const HIT_LINE = 12;   // px tolerance for grabbing a grid line
  const HIT_PT = 30;     // px tolerance for grabbing an anchor

  // ---------- geometry helpers ----------
  const vx = i => vfrac[i] * W;
  const hy = j => hfrac[j] * H;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  function cellBounds(ci, rj) {
    return { x0: vx(ci), x1: vx(ci + 1), y0: hy(rj), y1: hy(rj + 1) };
  }

  function anchorPos(a) {
    const b = cellBounds(a.ci, a.rj);
    switch (a.side) {
      case "left":   return { x: b.x0, y: b.y0 + a.t * (b.y1 - b.y0) };
      case "right":  return { x: b.x1, y: b.y0 + a.t * (b.y1 - b.y0) };
      case "top":    return { x: b.x0 + a.t * (b.x1 - b.x0), y: b.y0 };
      case "bottom": return { x: b.x0 + a.t * (b.x1 - b.x0), y: b.y1 };
    }
  }

  // Re-snap an anchor to the nearest boundary line of its cell, clamped inside it.
  function snapAnchor(a, mx, my) {
    const b = cellBounds(a.ci, a.rj);
    const px = clamp(mx, b.x0, b.x1);
    const py = clamp(my, b.y0, b.y1);
    const dLeft = px - b.x0, dRight = b.x1 - px;
    const dTop = py - b.y0, dBottom = b.y1 - py;
    const m = Math.min(dLeft, dRight, dTop, dBottom);
    const w = b.x1 - b.x0 || 1, h = b.y1 - b.y0 || 1;
    if (m === dLeft)        { a.side = "left";   a.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dRight)  { a.side = "right";  a.t = clamp((py - b.y0) / h, 0, 1); }
    else if (m === dTop)    { a.side = "top";    a.t = clamp((px - b.x0) / w, 0, 1); }
    else                    { a.side = "bottom"; a.t = clamp((px - b.x0) / w, 0, 1); }
  }

  // ---------- skeleton ----------
  function skeleton() {
    const head = anchorPos(anchors[0]);
    const lh = anchorPos(anchors[1]);
    const rh = anchorPos(anchors[2]);
    const lf = anchorPos(anchors[3]);
    const rf = anchorPos(anchors[4]);
    const feetC = { x: (lf.x + rf.x) / 2, y: (lf.y + rf.y) / 2 };
    const shoulder = lerp(head, feetC, 0.30);
    const pelvis = lerp(head, feetC, 0.62);
    return { head, lh, rh, lf, rf, shoulder, pelvis };
  }

  // ---------- rendering ----------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < vfrac.length; i++) {
      const x = Math.round(vx(i)) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let j = 0; j < hfrac.length; j++) {
      const y = Math.round(hy(j)) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // skeleton bones
    const s = skeleton();
    ctx.strokeStyle = RED;
    ctx.lineWidth = LINE_W;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    // spine
    ctx.moveTo(s.head.x, s.head.y); ctx.lineTo(s.shoulder.x, s.shoulder.y);
    ctx.lineTo(s.pelvis.x, s.pelvis.y);
    // arms
    ctx.moveTo(s.shoulder.x, s.shoulder.y); ctx.lineTo(s.lh.x, s.lh.y);
    ctx.moveTo(s.shoulder.x, s.shoulder.y); ctx.lineTo(s.rh.x, s.rh.y);
    // legs
    ctx.moveTo(s.pelvis.x, s.pelvis.y); ctx.lineTo(s.lf.x, s.lf.y);
    ctx.moveTo(s.pelvis.x, s.pelvis.y); ctx.lineTo(s.rf.x, s.rf.y);
    ctx.stroke();

    // joints (semicircle-ish dots)
    ctx.fillStyle = RED;
    dot(s.head, HEAD_R);
    dot(s.lh, LIMB_R); dot(s.rh, LIMB_R);
    dot(s.lf, LIMB_R); dot(s.rf, LIMB_R);

    // highlight whatever the pointer is hovering / dragging
    if (hover) drawHover(hover);
  }

  function dot(p, r) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHover(hv) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    if (hv.type === "anchor") {
      const p = anchorPos(anchors[hv.index]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, (hv.index === 0 ? HEAD_R : LIMB_R) + 6, 0, Math.PI * 2);
      ctx.stroke();
    } else if (hv.type === "vline") {
      const x = vx(hv.index);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    } else if (hv.type === "hline") {
      const y = hy(hv.index);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- hit testing ----------
  function pick(mx, my) {
    // anchors first (top priority)
    for (let i = 0; i < anchors.length; i++) {
      const p = anchorPos(anchors[i]);
      const r = (i === 0 ? HEAD_R : LIMB_R) + HIT_PT * 0.5;
      if ((mx - p.x) ** 2 + (my - p.y) ** 2 <= r * r) {
        return { type: "anchor", index: i };
      }
    }
    // interior grid lines
    let best = null, bestD = HIT_LINE;
    for (let i = 1; i < vfrac.length - 1; i++) {
      const d = Math.abs(mx - vx(i));
      if (d < bestD) { bestD = d; best = { type: "vline", index: i }; }
    }
    for (let j = 1; j < hfrac.length - 1; j++) {
      const d = Math.abs(my - hy(j));
      if (d < bestD) { bestD = d; best = { type: "hline", index: j }; }
    }
    return best;
  }

  // ---------- interaction ----------
  let drag = null;   // active drag descriptor
  let hover = null;  // hovered element (for highlight)

  function pointerXY(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function onDown(e) {
    const { x, y } = pointerXY(e);
    const hit = pick(x, y);
    if (!hit) return;
    drag = hit;
    if (hit.type === "anchor") snapAnchor(anchors[hit.index], x, y);
    canvas.setPointerCapture(e.pointerId);
    draw();
  }

  function onMove(e) {
    const { x, y } = pointerXY(e);
    if (!drag) { hover = pick(x, y); draw(); return; }

    if (drag.type === "anchor") {
      snapAnchor(anchors[drag.index], x, y);
    } else if (drag.type === "vline") {
      const i = drag.index;
      const min = vfrac[i - 1] + 0.03;
      const max = vfrac[i + 1] - 0.03;
      vfrac[i] = clamp(x / W, min, max);
    } else if (drag.type === "hline") {
      const j = drag.index;
      const min = hfrac[j - 1] + 0.03;
      const max = hfrac[j + 1] - 0.03;
      hfrac[j] = clamp(y / H, min, max);
    }
    hover = drag;
    draw();
  }

  function onUp(e) {
    drag = null;
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    const { x, y } = pointerXY(e);
    hover = pick(x, y);
    updateCursor();
    draw();
  }

  function updateCursor() {
    canvas.style.cursor = hover
      ? (hover.type === "anchor" ? "grab"
        : hover.type === "vline" ? "ew-resize" : "ns-resize")
      : "default";
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", (e) => { onMove(e); if (!drag) updateCursor(); });
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("pointerleave", () => { if (!drag) { hover = null; updateCursor(); draw(); } });

  document.getElementById("reset").addEventListener("click", () => {
    vfrac = DEFAULT_V.slice();
    hfrac = DEFAULT_H.slice();
    anchors = DEFAULT_ANCHORS();
    draw();
  });

  // ---------- resize ----------
  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    draw();
  }
  window.addEventListener("resize", resize);
  resize();
})();
</script>
</body>
</html>
